[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "research-agent"
version = "1.1.0"
description = "Give your AI Agent eyes to see the entire internet. Search + Read 10+ platforms."
readme = "USAGE.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "Neo Reid" }]
keywords = ["agent-infrastructure", "ai-agent", "llm-tools", "mcp", "search", "web-reader"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "feedparser>=6.0",
    "loguru>=0.7",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
    "requests>=2.28",
    "rich>=13.0",
    "yt-dlp>=2024.0",
]

[project.optional-dependencies]
all = [
    "browser-cookie3>=0.19",
    "mcp[cli]>=1.0",
    "playwright>=1.40",
]
browser = ["playwright>=1.40"]
cookies = ["browser-cookie3>=0.19"]

[project.urls]
Homepage = "https://github.com/AustinWp/research-agent"
Repository = "https://github.com/AustinWp/research-agent"
Issues = "https://github.com/AustinWp/research-agent/issues"

[project.scripts]
research-agent = "research_agent.cli:main"

[tool.setuptools.packages.find]
include = ["research_agent*"]

[tool.setuptools.package-data]
research_agent = ["**/*.md"]
